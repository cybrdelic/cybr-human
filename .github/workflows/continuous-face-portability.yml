name: Continuous face portability
on:
  push:
    paths: ['continuous-face/**', '.github/workflows/continuous-face-portability.yml']
  pull_request:
    paths: ['continuous-face/**', '.github/workflows/continuous-face-portability.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: continuous-face
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: continuous-face
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: continuous-face/requirements-observed.txt
      - name: Install observed Python dependencies and portable build driver
        run: python -m pip install --no-compile -r requirements-observed.txt "cmake>=3.20"
      - name: Verify frozen source and mechanics fixtures
        run: python -B tests/smoke.py
      - name: Test platform contracts
        run: python -B -m unittest discover -s tests -p test_portable_runtime.py
      - name: Compile native rasterizer and test actual pixels
        run: python -B tests/native_render_smoke.py
      - name: Locate or install FFmpeg on Linux
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 8
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            # The hosted image prioritizes Azure's HTTP mirror, which can
            # keep transferring too slowly to trigger an inactivity timeout.
            # Prefer the image's official HTTPS fallback archives for this job.
            if [[ -f /etc/apt/apt-mirrors.txt ]]; then
              printf '%s\n' \
                $'https://archive.ubuntu.com/ubuntu/\tpriority:1' \
                $'https://security.ubuntu.com/ubuntu/\tpriority:2' \
                | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            fi
            apt_options=(
              -o Acquire::http::Timeout=20
              -o Acquire::https::Timeout=20
              -o Acquire::Retries=2
              -o DPkg::Lock::Timeout=30
            )
            sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a \
              timeout --kill-after=15s 120s apt-get "${apt_options[@]}" update
            sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a \
              timeout --kill-after=15s 300s apt-get "${apt_options[@]}" \
              install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - name: Locate or install FFmpeg on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            brew install ffmpeg
          fi
      - name: Locate or install FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Verify real media encode and decoded frame count
        run: python -B tests/media_tools_smoke.py
